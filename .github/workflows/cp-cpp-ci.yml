name: cp-cpp-ci

on:
  push:
    paths:
      - cp/cpp/**
      - .github/workflows/cp-cpp-ci.yml
  pull_request:
    paths:
      - cp/cpp/**
      - .github/workflows/cp-cpp-ci.yml

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S cp/cpp -B cp/cpp/build

      - name: Build
        run: cmake --build cp/cpp/build --config Release

      - name: Test
        run: ctest --test-dir cp/cpp/build --output-on-failure

      - name: Benchmark
        run: |
          chmod +x cp/cpp/build/sieva_bench || true
          cp/cpp/build/sieva_bench
